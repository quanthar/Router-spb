<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Пешеходные маршруты по Санкт-Петербургу на интерактивной карте">
  <title>Прогулки по Петербургу</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <!-- App styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══ Welcome / Route Selection Screen ═══ -->
  <div id="welcome-screen">
    <div class="welcome-overlay"></div>

    <div class="welcome-content">
      <div class="welcome-header">
        <div class="welcome-icon">✨</div>
        <div class="birthday-eyebrow">С Днём Рождения!</div>
        <h1 class="welcome-title">Ваша праздничная прогулка по Петербургу</h1>
        <p class="welcome-subtitle">Мы приготовили для вас особенные маршруты. Выберите свой и наслаждайтесь красотой этого дня.</p>
        <button id="open-postcard-btn" class="postcard-reopen-btn" title="Открыть праздничную открытку">
          💌 Открытка от Игоря
        </button>
      </div>

      <div id="routes-list" class="routes-list">
        <!-- Route cards injected by JS -->
      </div>
    </div>
  </div>

  <!-- ═══ Postcard Modal (First Visit / Greeting) ═══ -->
  <div id="postcard-modal" class="postcard-modal-backdrop hidden">
    <div class="postcard-container">
      <button id="postcard-close-x" class="postcard-close-x" title="Закрыть">✕</button>
      
      <div class="postcard-card">
        <div class="postcard-image-wrapper">
          <img src="postcard.jpg" alt="С Днём Рождения!" class="postcard-image" />
        </div>
        
        <div class="postcard-body">
          <div class="postcard-sender">От Игоря</div>
          <p class="postcard-message">Желаю вам прекрасной прогулки по нашему городу!</p>
          <button id="postcard-close-btn" class="postcard-action-btn">
            <span>Закрыть</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Map Screen (hidden until route selected) ═══ -->
  <div id="map-screen" class="hidden">
    <div id="map"></div>

    <!-- Back button overlay -->
    <button id="back-btn" class="back-btn" title="Вернуться к выбору маршрута">← Маршруты</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <!-- App logic -->
  <script src="app.js"></script>

</body>
</html>
